# Baysöz Labs <baysozlabs@proton.me> — baysoz-profilediff
[project]
name = "baysoz-profilediff"
version = "1.0.0"
description = "Deterministic offline pprof differential regression oracle with noise-aware SARIF CI gates — Baysöz Labs <baysozlabs@proton.me>"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Baysöz Labs", email = "baysozlabs@proton.me" },
]
keywords = [
    "observability",
    "pprof",
    "profiling",
    "regression",
    "sarif",
    "ci",
    "baysöz-labs",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/yazilimbaysoz-svg/baysoz-profilediff"
Issues = "https://github.com/yazilimbaysoz-svg/baysoz-profilediff/issues"
Maintainer = "mailto:baysozlabs@proton.me"

[project.scripts]
profilediff = "baysoz_profilediff.cli:main"
baysoz-profilediff = "baysoz_profilediff.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baysoz_profilediff"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.17",
    "semgrep>=1.100",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
per-file-ignores = { "tests/*" = ["S101"] }
